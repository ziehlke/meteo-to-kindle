[project]
name = "meteo-to-kindle"
version = "0.1.0"
description = "Fetches a meteo.pl forecast, overlays Airly air quality data and formats it for a Kindle e-ink display"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pillow",
    "matplotlib",
    "numpy",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["airly", "config", "get_image", "image_processor"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
